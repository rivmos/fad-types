name: CI

# Every consumer (fad-backend, fad-admin, rfm-app) pins this package to `#main`, so a
# commit that does not typecheck reaches all three on their next install. This is the
# only thing standing between that and a silent three-app break. (P0-22)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm type:check
