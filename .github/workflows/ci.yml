name: CI

# Every consumer (fad-backend, fad-admin, rfm-app) pins this package to `#main`, so a
# commit that does not typecheck reaches all three on their next install. This is the
# only thing standing between that and a silent three-app break. (P0-22)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly as well (P3-16): new advisories appear without any change to this
  # repo, and a gate that only runs on push never sees them.
  schedule:
    - cron: "0 3 * * 1"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # P3-16. There are no runtime dependencies, and this keeps it that way
      # honestly: anything added here reaches all three apps.
      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        run: pnpm type:check
